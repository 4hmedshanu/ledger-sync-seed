plugins {
    id 'java'
    id 'application'
}

group = 'in.simplifymoney'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    'src/document/java'
            ]
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'com.h2database:h2:2.2.224'

    implementation platform(
            'org.mongodb:mongodb-driver-bom:5.11.1')
    implementation 'org.mongodb:mongodb-driver-sync'

    testImplementation platform(
            'org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly(
            'org.junit.platform:junit-platform-launcher')
}

application {
    mainClass = 'in.simplifymoney.ledgersync.App'
}

test {
    useJUnitPlatform()
}

tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    mainClass =
            'in.simplifymoney.ledgersync.SelfCheck'
    classpath =
            sourceSets.main.runtimeClasspath
}

tasks.register('documentStore', JavaExec) {
    group = 'application'
    description =
            'Run MongoDB backfill or consistency check'
    mainClass =
            'in.simplifymoney.ledgersync.DocumentStoreApp'
    classpath =
            sourceSets.main.runtimeClasspath
}

tasks.register('documentBenchmark', JavaExec) {
    group = 'verification'
    description =
            'Benchmark MongoDB queries at 100,000 transactions'
    mainClass =
            'in.simplifymoney.ledgersync.MongoBenchmarkApp'
    classpath =
            sourceSets.main.runtimeClasspath
}