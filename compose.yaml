services:
  mongodb:
    image: mongo:8.0
    container_name: simplify-ledger-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: ledger_sync
    volumes:
      - ledger_mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ledger_mongo_data: